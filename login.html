<!DOCTYPE html>

<html lang="pt-br">

<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

  <header class="auth-header">
    <a href="index.html" class="logo">
      <div class="logo-icon">🤝</div>
      Solidariedade<span>Já</span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1 id="login-title">Bem-vindo!</h1>
      <p class="auth-sub">Acesse sua conta para fazer uma doação.</p>
      
      <form action="index.html">
        <div class="form-group">
          <label>Nome da empresa</label>
          <input type="text" placeholder="Ex.: Nome da Empresa" required>
        </div>

        <div class="form-group">
          <label>Senha</label>
          <input type="password" placeholder="********" required>
        </div>

        <button type="submit" class="btn-auth" id="btn-entrar">Entrar</button>

        <p class="auth-link">Ainda não tem conta? <a href="cadastro.html" id="link-cadastro">Cadastre-se</a></p>
      </form>
      
    </section>
  </main>

  <footer class="auth-footer"><p>© 2026 SolidariedadeJá – Todos Os Direitos Reservados.</p></footer>

</body>

</html>
