<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

  <header class="auth-header">
    <a href="index.html" class="logo">
      <div class="logo-icon">🤝</div>
      Solidariedade<span>Já</span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1 id="cadastro-title">Cadastro</h1>
      <p class="auth-sub">Preencha os dados abaixo para poder fazer uma doação.</p>

      <form action="login.html">
        <div class="form-group">
        <label>Nome da Empresa</label>
        <input type="text" placeholder="Ex.: Nome da Empresa" required>
        </div>

        <div class="form-group">
          <label>Nome do Responsável</label>
          <input type="text" placeholder="Ex.: Maria da Silva" required>
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="Ex. contato@gmail.com" required>
        </div>

        <div class="form-group">
          <label>CNPJ</label>
          <input type="text" placeholder="Ex. 00.000.000/0001-00" maxlength="18" required>
        </div>

        <div class="form-group">
          <label>Senha</label>
          <input type="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
        </div>
        
        <div class="form-group">
          <label>Confirmar senha</label>
          <input type="password" placeholder="Repita a senha" minlength="8" required>
        </div>

        <button type="submit" class="btn-auth" id="btn-cadastrar">Criar conta</button> 
      </form>

      <p class="auth-link">Já tem uma conta? <a href="login.html" id="link-login">Fazer login</a></p>
    </section>
  </main>

  <footer class="auth-footer"><p>© 2026 SolidariedadeJá – Todos Os Direitos Reservados.</p></footer>

</body>

</html>
